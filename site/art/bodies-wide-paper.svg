<svg xmlns="http://www.w3.org/2000/svg" class="fb" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="fb-title fb-desc">
<title id="fb-title">One model, three bodies</title>
<desc id="fb-desc">Diagram: one set of decision layers drives three bodies. The decision layers, an account world model, policy layers and a critic built to learn from calls, screens, edits and outcomes, sit over one action interface: intent, target, parameters, approval. It feeds three bodies: today an agent working in tools and text, next a voice and avatar on a video tile, later a humanoid, drawn dashed because it is not built. Only the humanoid needs motor control, a layer built by robot makers.</desc>
